# 開発メモ(試作)の Android アプリを作る
# - APK(試作用の鍵):Releases に置き、スマホに直接入れて試す
# - AAB(アップロード鍵):Google Play の内部テストに出す。Secrets に鍵が入っているときだけ署名する
name: 開発メモ APK

# アプリ化はいったん保留中。HTML 版を磨いている間は push では動かさず、
# 必要なときだけ Actions の「Run workflow」で手で動かす
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/worklog-memo-android
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # Android SDK はビルド機に入っているもの(ANDROID_HOME)を使う。足りない部品は Gradle が自分で入れる
      - uses: gradle/actions/setup-gradle@v4
      - name: アップロード鍵を一時ファイルに書き出す
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: APK と AAB を作る
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
          cp app/build/outputs/apk/debug/app-debug.apk "worklog-memo-${GITHUB_RUN_NUMBER}.apk"
          if [ "$HAS_UPLOAD_KEY" = "true" ]; then
            cp app/build/outputs/bundle/release/app-release.aab "worklog-memo-${GITHUB_RUN_NUMBER}-play.aab"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: worklog-memo-${{ github.run_number }}
          path: |
            prototype/worklog-memo-android/worklog-memo-*.apk
            prototype/worklog-memo-android/worklog-memo-*-play.aab
      # リポジトリの設定で Actions に書き込みの権限がないと、ここは 403 で失敗する。
      # そのときも APK・AAB は上の Artifacts(実行結果のページの下)から落とせるので、失敗扱いにしない
      - name: Releases に置く
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: worklog-memo-v${{ github.run_number }}
          name: 開発メモ 試作 ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            開発メモ(試作)の Android 版です。
            - worklog-memo-${{ github.run_number }}.apk:スマホに直接入れて試す版(試作用の鍵)。初めて入れるときは「提供元不明のアプリ」の許可が要ります
            - worklog-memo-${{ github.run_number }}-play.aab:Google Play Console の内部テストに上げる版(アップロード鍵で署名。鍵が設定されているときだけ置かれます)
          files: |
            prototype/worklog-memo-android/worklog-memo-*.apk
            prototype/worklog-memo-android/worklog-memo-*-play.aab
