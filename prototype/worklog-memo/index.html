<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1a1a19">
<title>作業記録メモ帳(試作)</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f3ef; --surface-1:#fcfcfb; --surface-2:#ecebe6; --line:#d9d7cf;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7a7873;
  --accent:#2a78d6; --accent-ink:#fff; --danger:#c4302f;
  --series-work:#2a78d6; --series-dist:#eb6834;
  --tab-sel:#0b0b0b; --tab-sel-ink:#fcfcfb;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#121211; --surface-1:#1a1a19; --surface-2:#252523; --line:#3a3936;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8f8d86;
    --accent:#3987e5; --danger:#e66767;
    --series-work:#3987e5; --series-dist:#d95926;
    --tab-sel:#f0efec; --tab-sel-ink:#121211;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text-primary);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:16px}
body{display:flex;flex-direction:column;height:100dvh;padding-top:var(--safe-t);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;min-height:0;overflow:auto;padding:12px 14px 24px}

/* nav */
nav.bottom{display:flex;border-top:1px solid var(--line);background:var(--surface-1);padding-bottom:var(--safe-b)}
nav.bottom button{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--text-muted)}
nav.bottom button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button.on{color:var(--text-primary);font-weight:600}
.livebar{font-size:11px;color:var(--text-muted);text-align:center;padding:3px 0;background:var(--surface-2);border-bottom:1px solid var(--line)}
.livebar b{color:var(--text-primary);font-variant-numeric:tabular-nums}

/* memo */
.tabs{background:var(--surface-1);border-bottom:1px solid var(--line)}
.tabs{max-height:36dvh;overflow:auto;padding:4px 0 6px}
.tabs.closed{display:none}
.node{display:flex;align-items:center;min-height:38px;padding-right:8px}
.node.sel{background:var(--surface-2)}
.node .tw{flex:none;width:30px;height:34px;font-size:14px;color:var(--text-secondary)}
.node .tw.leaf{color:var(--text-muted);font-size:10px}
.node .nm{flex:1;min-width:0;text-align:left;padding:7px 4px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.sel .nm{font-weight:700}
.node .cnt{font-size:11px;color:var(--text-muted);margin-right:6px}
.node .addc{flex:none;font-size:12px;padding:5px 9px;border-radius:999px;border:1px dashed var(--text-muted);color:var(--text-secondary)}
.addroot{display:block;margin:4px 0 0 12px;font-size:13px;color:var(--text-secondary);padding:6px 4px}
.toolbar{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--surface-1);align-items:center}
.tb{white-space:nowrap;flex:none;padding:7px 9px;border-radius:8px;font-size:13px;color:var(--text-secondary);display:flex;gap:4px;align-items:center}
.tb:active{background:var(--surface-2)}
.tb.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.spacer{flex:1}
.saved{white-space:nowrap;font-size:11px;color:var(--text-muted);padding:0 6px}
.memohead{padding:8px 14px 0;background:var(--surface-1)}
.memotitle{width:100%;border:0;background:none;font-size:20px;font-weight:700;padding:4px 0;outline:none}
.crumb{font-size:11px;color:var(--text-muted);min-height:14px}
.metas{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px}
.mini{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--text-secondary)}
.mini.tag::before{content:"#"}
.mini.link::before{content:"↔ "}
.memobody{flex:1;min-height:0;width:100%;border:0;resize:none;outline:none;background:var(--surface-1);
  padding:10px 14px 40px;line-height:1.75;font-size:16px}

/* outline */
.outline{flex:1;min-height:0;overflow:auto;background:var(--surface-1);padding:8px 8px 120px}
.ol-row{display:flex;align-items:flex-start;padding-left:calc(var(--d) * 22px);border-radius:8px;
  background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px 22px);
  background-size:calc(var(--d) * 22px) 100%;background-repeat:no-repeat;background-position:11px 0}
.ol-row.cur .ol-t{background:var(--surface-2)}
.bul{flex:none;width:22px;height:34px;font-size:13px;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;padding:0}
.bul.leaf{font-size:9px;color:var(--text-muted)}
.ol-main{flex:1;min-width:0}
.ol-t{display:block;width:100%;border:0;outline:none;resize:none;background:none;padding:6px 6px;border-radius:6px;
  font-size:16px;line-height:1.45;overflow:hidden;field-sizing:content;min-height:34px}
.ol-v{display:block;width:100%;padding:6px 6px;border-radius:6px;font-size:16px;line-height:1.45;min-height:34px;
  white-space:pre-wrap;overflow-wrap:anywhere;cursor:text;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ol-v:empty::before{content:attr(data-ph);color:var(--text-muted)}
.ol-row.cur .ol-v{background:var(--surface-2)}
.ol-row.pressing .ol-v{background:var(--surface-2);transition:background .35s}
.foldcnt{font-size:11px;color:var(--text-muted);padding:0 6px 4px}
.ol-rel{display:flex;flex-wrap:wrap;gap:4px;padding:0 6px 6px}
.ol-crumb{font-size:12px;color:var(--text-muted);padding:2px 6px}
.ol-crumb button{color:var(--accent);font-size:12px;padding:2px 0}
.ol-zoomtitle{font-size:19px;font-weight:700;padding:2px 6px 8px}
.oltools{display:none;gap:2px;padding:4px 6px calc(4px + var(--safe-b));border-top:1px solid var(--line);background:var(--surface-1)}
.oltools button{flex:1;padding:10px 0;font-size:16px;border-radius:8px;color:var(--text-primary)}
.oltools button:active{background:var(--surface-2)}
.oltools .ot-tpl{flex:1.7;font-size:13px;font-weight:600;color:var(--accent)}
body.editing .oltools{display:flex}
body.editing.kb nav.bottom{display:none}

.bul{touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ol-row{-webkit-touch-callout:none}
.ol-row.pressing .ol-t{background:var(--surface-2);transition:background .35s}
.ol-row.dragging{opacity:.3}
.ol-row.dropin .ol-t{outline:2px solid var(--accent);outline-offset:-2px}
.ol-row.moved .ol-t{background:color-mix(in srgb,var(--accent) 18%,transparent);transition:background .6s}
.dropline{position:fixed;height:3px;background:var(--accent);border-radius:2px;pointer-events:none;z-index:40;display:none}
.dragghost{position:fixed;display:none;pointer-events:none;z-index:41;background:var(--surface-1);border:1px solid var(--line);
  box-shadow:0 4px 14px #0003;border-radius:8px;padding:6px 10px;font-size:14px;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.dragging{-webkit-user-select:none;user-select:none;cursor:grabbing}

.tplbox{border-top:1px solid var(--line);padding:12px 0 4px;margin-top:10px}

/* files */
.filebar{display:flex;align-items:center;gap:6px;background:var(--surface-1);border-bottom:1px solid var(--line);padding-right:8px}
.fb-open{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:9px 6px 9px 14px;text-align:left;font-size:15px}
.fb-open b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-new{flex:none;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.fb-ic{color:var(--text-secondary);font-size:17px}
.fb-board{color:var(--accent);font-weight:600;font-size:14px;white-space:nowrap}
.fb-sep{color:var(--text-muted)}
.fb-cv{color:var(--text-muted);font-size:12px;margin-left:auto}

/* board */
.board{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
  background-color:var(--bg);background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:22px 22px}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.edge{stroke:var(--text-secondary);stroke-width:1.8;fill:none}
.edge.tmp{stroke:var(--accent);stroke-dasharray:5 4}
.edge-hit{stroke:transparent;stroke-width:24;fill:none;pointer-events:stroke}
.edge-label{font-size:12px;fill:var(--text-secondary);paint-order:stroke;stroke:var(--bg);stroke-width:4px;pointer-events:all}
.bcard{position:absolute;background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:9px 14px 8px 12px;box-shadow:0 1px 3px #0001}
.bcard.cur{border-color:var(--accent);border-width:1.5px}
.bcard.moving{box-shadow:0 8px 20px #0003;z-index:2}
.bcard.linktarget{outline:2.5px solid var(--accent);outline-offset:2px}
.bc-t{font-weight:700;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.bc-p{font-size:12px;color:var(--text-secondary);margin-top:4px;line-height:1.5}
.bc-p div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-m{font-size:10px;color:var(--text-muted);margin-top:4px}
.bc-h{position:absolute;right:-11px;bottom:-11px;width:22px;height:22px;border-radius:50%;background:var(--surface-1);border:2px solid var(--accent)}
.bc-h::before{content:"";position:absolute;inset:-9px}
.bc-h::after{content:"";position:absolute;left:5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.c-red{background:color-mix(in srgb,#e34948 15%,var(--surface-1));border-color:color-mix(in srgb,#e34948 45%,var(--line))}
.c-orange{background:color-mix(in srgb,#eb6834 15%,var(--surface-1));border-color:color-mix(in srgb,#eb6834 45%,var(--line))}
.c-yellow{background:color-mix(in srgb,#eda100 18%,var(--surface-1));border-color:color-mix(in srgb,#eda100 50%,var(--line))}
.c-green{background:color-mix(in srgb,#1baf7a 15%,var(--surface-1));border-color:color-mix(in srgb,#1baf7a 45%,var(--line))}
.c-blue{background:color-mix(in srgb,#2a78d6 15%,var(--surface-1));border-color:color-mix(in srgb,#2a78d6 45%,var(--line))}
.c-purple{background:color-mix(in srgb,#6250d6 15%,var(--surface-1));border-color:color-mix(in srgb,#6250d6 45%,var(--line))}
.bctl{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.bctl .lasso-btn{font-size:13px;font-weight:700;color:var(--accent)}
.bctl .lasso-btn.on{background:var(--accent);color:var(--accent-ink)}
.board.lassoing{cursor:crosshair}
.lasso{fill:color-mix(in srgb,var(--accent) 8%,transparent);stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 5;stroke-linejoin:round}
.gshape{fill:color-mix(in srgb,var(--gc) 7%,transparent);stroke:color-mix(in srgb,var(--gc) 55%,transparent);stroke-width:2;stroke-linejoin:round}
.board.compact .bc-p,.board.compact .bc-m{display:none}
.board.compact .bc-t{font-size:25px;line-height:1.25}
.board.compact .glabel{font-size:20px;padding:7px 34px 7px 14px}
.board.compact .glabel .gl-k{font-size:16px}
.board.compact .bcard{padding:10px 14px 12px 12px}
.gshape.hot{fill:color-mix(in srgb,var(--gc) 16%,transparent);stroke:var(--gc);stroke-width:3.5}
#glabels{position:absolute;left:0;top:0}
.glabel{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;white-space:nowrap;padding:5px 26px 5px 11px;border-radius:999px;
  background:var(--surface-1);border:1.5px solid color-mix(in srgb,var(--accent) 55%,var(--line));font-size:13px;font-weight:700;box-shadow:0 1px 3px #0002;cursor:grab}
.glabel .gl-k{font-size:11px;font-weight:600;color:var(--text-muted)}
.gl-h{position:absolute;right:4px;top:50%;margin-top:-8px;width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);background:var(--surface-1)}
.gl-h::before{content:"";position:absolute;inset:-10px}
.gl-h::after{content:"";position:absolute;left:3px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.bctl button{min-width:42px;height:42px;padding:0 10px;border-radius:12px;background:var(--surface-1);border:1px solid var(--line);font-size:18px;box-shadow:0 1px 3px #0002}
.bctl button[data-z="fit"]{font-size:13px;font-weight:600}
.bhint{position:absolute;left:12px;right:170px;bottom:12px;font-size:11.5px;line-height:1.55;color:var(--text-secondary);background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:8px 10px;pointer-events:none}
@media (max-width:420px){.bhint{right:12px;bottom:64px}.bctl button{min-width:38px;padding:0 8px}}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw2{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface-1);font-size:10px;color:var(--text-muted)}
.sw2.on{outline:2.5px solid var(--accent);outline-offset:2px}

/* generic */
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--text-secondary);font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{padding:6px 14px;border-radius:8px;font-size:14px;color:var(--text-secondary)}
.seg button.on{background:var(--surface-1);color:var(--text-primary);font-weight:600;box-shadow:0 1px 2px #0002}
.periodnav{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.periodnav .lbl{font-weight:600}
.periodnav button{padding:6px 12px;font-size:18px;color:var(--text-secondary)}
.tiles{display:grid;grid-template-columns:1.55fr 1fr 1fr;gap:8px;margin-bottom:12px}
.tile{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile .k{font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:5px}
.tile .v{font-size:16px;white-space:nowrap;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .s{font-size:11px;color:var(--text-muted);margin-top:2px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.muted{color:var(--text-muted);font-size:13px}
.small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.field{display:block;margin:10px 0}
.field>span{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-1);outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{line-height:1.6;resize:vertical}
.btn{padding:10px 16px;border-radius:10px;background:var(--surface-2);font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btns{display:flex;gap:8px;margin-top:14px}
.btns .btn{flex:1}
.empty{color:var(--text-muted);font-size:14px;text-align:center;padding:24px 0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-secondary);margin:2px 0 8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--text-muted);font-size:10px}
.tip{position:absolute;pointer-events:none;background:var(--text-primary);color:var(--surface-1);font-size:12px;
  padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);display:none;line-height:1.5}
.note{font-size:12px;color:var(--text-secondary);background:var(--surface-2);border-radius:10px;padding:9px 11px;line-height:1.6}

/* timer */
.clock{font-size:64px;font-weight:300;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:18px 0 4px}
.phase{text-align:center;font-size:14px;color:var(--text-secondary);min-height:20px}
.ring{display:block;margin:6px auto 0}
.bigbtn{display:block;margin:18px auto 6px;width:150px;padding:14px;border-radius:999px;font-size:18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.bigbtn.stop{background:var(--danger)}

/* plan */
.daygroup{font-size:13px;font-weight:700;color:var(--text-secondary);margin:14px 0 4px}
.daygroup.today{color:var(--accent)}
.ev{display:flex;gap:10px;padding:10px 12px;background:var(--surface-1);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;text-align:left;width:100%}
.ev .t{font-size:13px;color:var(--text-secondary);width:88px;flex:none;font-variant-numeric:tabular-nums}
.ev .ti{font-weight:600}
.fab{position:absolute;right:16px;bottom:16px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:28px;box-shadow:0 3px 10px #0004}

/* sheet */
.veil{position:fixed;inset:0;background:#0007;display:none;z-index:20;align-items:flex-end;justify-content:center}
.veil.on{display:flex}
.sheet{background:var(--surface-1);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:16px 16px 0 0;
  padding:14px 16px calc(18px + var(--safe-b))}
.sheet h2{font-size:17px;margin:4px 0 10px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.banner{position:fixed;left:10px;right:10px;top:calc(8px + var(--safe-t));z-index:30;background:var(--text-primary);color:var(--surface-1);
  border-radius:12px;padding:12px 14px;display:none;box-shadow:0 4px 16px #0005;font-size:14px}
.banner.on{display:block}
.toast{position:fixed;left:50%;bottom:calc(132px + var(--safe-b));transform:translateX(-50%);background:var(--text-primary);color:var(--surface-1);
  padding:8px 14px;border-radius:999px;font-size:13px;z-index:31;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.hit{background:#ffd54a55;border-radius:3px}
</style>
</head>
<body>
<div class="livebar" id="livebar">作業時間 自動記録中 <b id="liveToday">0分</b>(今日)</div>
<main>
  <!-- メモ -->
  <section class="view" id="v-memo">
    <div class="filebar"><button class="fb-open" id="fileBar" aria-label="ボードを開く"><span class="fb-board">◧ ボード</span><span class="fb-sep">›</span><b id="fbName"></b></button>
      <button class="fb-new" id="newMemo">＋ 新しいメモ</button></div>
    <div class="toolbar">
      <button class="tb" id="btnSearch">検索</button>
      <button class="tb" id="btnTpl">テンプレ</button>
      <button class="tb" id="btnFold">全部開く/畳む</button>
      <span class="spacer"></span>
      <span class="saved" id="saved"></span>
    </div>
    <div class="outline" id="outline"></div>
    <div class="oltools" id="oltools">
      <button data-op="out" aria-label="一段戻す">←</button>
      <button data-op="in" aria-label="字下げして子にする">→</button>
      <button data-op="up" aria-label="上へ移動">↑</button>
      <button data-op="down" aria-label="下へ移動">↓</button>
      <button data-op="fold" aria-label="畳む/開く">▾▸</button>
      <button data-op="child" aria-label="子を追加">＋子</button>
      <button data-op="tpl" class="ot-tpl" aria-label="テンプレートを入れる">テンプレ</button>
      <button data-op="more" aria-label="この行の操作">⋯</button>
    </div>
  </section>

  <!-- ボード(すべてのメモ) -->
  <section class="view" id="v-board">
    <div class="filebar"><button class="fb-open" id="boardBack"><span class="fb-board">← メモへ戻る</span></button>

<script>
"use strict";
/* ============================================================
   ユーティリティ
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ym = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const WD = ["日", "月", "火", "水", "木", "金", "土"];
function fmtDur(ms) {
  const m = Math.floor(ms / 60000);
  if (m < 1) return ms > 0 ? "1分未満" : "0分";
  const h = Math.floor(m / 60);
  return h ? `${h}時間${pad(m % 60)}分` : `${m}分`;
}
// 作業時間は秒まで出す
function fmtSec(ms) {
  const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  return h ? `${h}時間${pad(m)}分${pad(s)}秒` : m ? `${m}分${pad(s)}秒` : `${s}秒`;
}
function fmtClock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
  return h ? `${h}:${pad(m)}:${pad(ss)}` : `${pad(m)}:${pad(ss)}`;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 1800);
}

/* ============================================================
   保存層:端末内(localStorage)を即時の正とし、
   claude.ai の個人用ストア(db)へ追って同期する
   ============================================================ */
const LS = {
  get(k) { try { const v = localStorage.getItem("wm:" + k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem("wm:" + k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem("wm:" + k); } catch {} },
  keys() { try { return Object.keys(localStorage).filter(k => k.startsWith("wm:")).map(k => k.slice(3)); } catch { return []; } }
};
const Store = {
  col: null, status: "端末内のみ", pending: new Map(), inflight: new Set(),
  // 書き込み:端末内へ即時、リモートへは間をおいて一件ずつ
  put(id, data) {
    data._ts = Date.now();
    LS.set("doc:" + id, data);
    this.schedule(id);
  },
  putRaw(id, data, ts) { data._ts = ts || Date.now(); LS.set("doc:" + id, data); this.schedule(id); },
  remove(id) {
    LS.del("doc:" + id);
    this.pending.delete(id);
    if (this.col) this.col.doc(id).delete().catch(() => {});
  },
  schedule(id) {
    if (!this.col) return;
    clearTimeout(this.pending.get(id));
    this.pending.set(id, setTimeout(() => this.flush(id), 1200));
  },
  async flush(id) {
    this.pending.delete(id);
    if (!this.col) return;
    if (this.inflight.has(id)) { this.schedule(id); return; }
    const data = LS.get("doc:" + id); if (!data) return;
    this.inflight.add(id);
    try { await this.col.doc(id).set(data); }
    catch (e) {
      if (e && e.code === "unavailable") setTimeout(() => this.schedule(id), 2000 + Math.random() * 2000);
      else if (e && e.code === "quota_exceeded") toast("保存容量の上限に達しました");
      else if (e && (e.code === "invalid_argument" || e.code === "revoked")) { this.col = null; this.status = "端末内のみ(同期不可)"; }
    } finally { this.inflight.delete(id); }
  },
  flushAll() { for (const id of [...this.pending.keys()]) { clearTimeout(this.pending.get(id)); this.flush(id); } },
  localDocs() {
    const out = {};
    for (const k of LS.keys()) if (k.startsWith("doc:")) { const v = LS.get(k); if (v) out[k.slice(4)] = v; }
    return out;
  }
};
// 起動後に、リモートの内容と突き合わせる(新しい方を採る)
Store.connect = async function (onMerged) {
  const api = window.claude && typeof window.claude.use === "function" ? window.claude : null;
  if (!api) return;
  let db, user, id;
  try {
    [db, user] = await Promise.all([api.use("db"), api.use("user")]);
    if (!db || !user) return;
    id = await user.id();
    if (!id) return;
  } catch { return; }
  const col = db.collection("data/users/" + id); // 3区切り=自分専用のコレクション
  this.status = "同期を確認中…";
  let snap;
  const timer = setTimeout(() => { this.status = "同期先に届きません(端末内に保存中)"; renderPrefsIfOpen(); }, 10000);
  try { snap = await col.get(); }
  catch (e) { clearTimeout(timer); this.status = "端末内のみ(同期不可)"; renderPrefsIfOpen(); return; }
  clearTimeout(timer);
  this.col = col;
  this.status = "claude.ai に同期中";
  flushMemoEdit();
  const local = this.localDocs();
  const remoteIds = new Set();
  const fresh = !!LS.get("fresh"); // この端末で初めての同期 → 食い違えば同期先を正とする
  let changed = false;
  for (const d of snap.docs) {
    if (!d.exists) continue;
    remoteIds.add(d.id);
    const r = JSON.parse(JSON.stringify(d.data())); const l = local[d.id];
    if (d.id.startsWith("log-") && l) { // 作業の記録は、どちらの端末の分も失わないよう合わせる
      const m = mergeLog(l, r), same = (x, y) => JSON.stringify({ ...x, _ts: 0 }) === JSON.stringify({ ...y, _ts: 0 });
      if (!same(m, l)) { LS.set("doc:" + d.id, m); changed = true; }
      if (!same(m, r)) { if (same(m, l)) LS.set("doc:" + d.id, m); this.schedule(d.id); }
      continue;
    }
    if (!l || fresh || (r._ts || 0) > (l._ts || 0)) { LS.set("doc:" + d.id, r); changed = true; }
    else if ((l._ts || 0) > (r._ts || 0)) this.schedule(d.id);
  }
  for (const k of Object.keys(local)) if (!remoteIds.has(k)) this.schedule(k);
  LS.del("fresh");
  if (changed) onMerged();
  renderPrefsIfOpen();
};

function mergeLog(l, r) {
  const m = { sessions: [], timers: [], usage: {}, _ts: Math.max(l._ts || 0, r._ts || 0) };
  const ss = new Map();
  for (const [s, e] of [...(l.sessions || []), ...(r.sessions || [])]) ss.set(s, Math.max(ss.get(s) || 0, e));
  m.sessions = [...ss].sort((a, b) => a[0] - b[0]);
  const tm = new Map(); for (const t of [...(l.timers || []), ...(r.timers || [])]) tm.set(t.id, t);
  m.timers = [...tm.values()].sort((a, b) => a.s - b.s);
  const [older, newer] = (l._ts || 0) > (r._ts || 0) ? [r, l] : [l, r]; // 手入力の分数は、新しい方を採る
  for (const src of [older.usage || {}, newer.usage || {}]) for (const [d, apps] of Object.entries(src)) m.usage[d] = { ...(m.usage[d] || {}), ...apps };
  return m;
}

/* ============================================================
   データモデル
   file-<id> : メモ1件(名前・入れ子の行)/ board : ボード上のカードの位置・色と矢印 / meta : 設定・予定
   outline : 1枚だった頃のメモ(移行元)/ memo-<id> : タブ形式だった頃のメモ(移行元)
   log-YYYY-MM : その月の作業区間・タイマー記録・妨害アプリ使用時間
   ============================================================ */
const DEFAULT_TPL = {
  "素材": "【素材名】\n  種類:\n  入手場所:\n  用途:\n  見た目のメモ:",
  "アイテム": "【アイテム名】\n  分類:\n  効果:\n  入手方法:\n  必要な素材:\n  価格:\n  説明文:",
  "設定": "【項目名】\n  概要:\n  詳細:\n  関連する要素:\n  未決事項:"
};
let memos = {}, meta = null, logs = {};
function loadAll() {
  memos = {}; logs = {};
  const docs = Store.localDocs();
  for (const [id, v] of Object.entries(docs)) {
    if (id.startsWith("memo-")) memos[v.id] = v;
    else if (id.startsWith("log-")) logs[id.slice(4)] = v;
  }
  meta = docs.meta || null;
  if (!meta) meta = { links: [], events: [], apps: [], prefs: {}, guideSeen: false, current: null };
  meta.links ||= []; meta.events ||= []; meta.apps ||= []; meta.prefs ||= {};
  const p = meta.prefs;
  p.focus ??= 25; p.brk ??= 5; p.goal ??= 0; p.templates ||= { ...DEFAULT_TPL };
  if (!p.tplV) { // 旧版のテンプレートを字下げ形式に直す
    for (const k of Object.keys(p.templates)) { const ls = p.templates[k].split("\n").filter(x => x.trim()); if (ls.length > 1 && !ls.slice(1).some(x => /^[\t 　]/.test(x))) p.templates[k] = [ls[0], ...ls.slice(1).map(x => "  " + x)].join("\n"); }
    p.tplV = 2;
  }
  meta.groups ||= [];
  loadFiles(docs);
  loadBoard(docs);
}
const saveMeta = () => Store.put("meta", meta);
function logOf(key) { return logs[key] ||= { sessions: [], timers: [], usage: {} }; }
const saveLog = key => Store.put("log-" + key, logs[key]);

/* ============================================================
   作業時間の自動記録:画面が前面にある間だけ数える
   ============================================================ */
const Work = {
  live: null,
  start() {
    if (this.live || document.visibilityState !== "visible") return;
    const now = Date.now();
    this.live = { s: now, beat: now };
    LS.set("live", this.live);
  },
  beat() { if (this.live) { this.live.beat = Date.now(); LS.set("live", this.live); } },
  stop(at) {
    if (!this.live) return;
    const e = at || Date.now();
    const s = this.live.s;
    this.live = null; LS.del("live");
    if (e - s < 2000) return;
    const key = ym(new Date(s));
    logOf(key).sessions.push([s, e]);
    saveLog(key);
  },
  recover() { // 前回、閉じ方が不意だった区間を最後の鼓動で閉じる
    const old = LS.get("live");
    if (old && old.s) { this.live = old; this.stop(old.beat || old.s); }
  }
};
function overlap(s, e, a, b) { return Math.max(0, Math.min(e, b) - Math.max(s, a)); }
function monthKeysBetween(a, b) {
  const out = []; let d = new Date(new Date(a).getFullYear(), new Date(a).getMonth() - 1, 1);
  while (d.getTime() <= b) { out.push(ym(d)); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
  return out;
}
function workMs(a, b) {
  let t = 0;
  for (const k of monthKeysBetween(a, b)) for (const [s, e] of (logs[k]?.sessions || [])) t += overlap(s, e, a, b);
  if (Work.live) t += overlap(Work.live.s, Date.now(), a, b);
  return t;
}
function timerMs(a, b) {
  let t = 0;
  for (const k of monthKeysBetween(a, b)) for (const r of (logs[k]?.timers || [])) t += overlap(r.s, r.e, a, b);
  const live = Timer.liveSegment(); if (live) t += overlap(live.s, Date.now(), a, b);
  return t;
}
function distMs(dateStr, appId) {
  const u = logs[dateStr.slice(0, 7)]?.usage?.[dateStr] || {};
  if (appId) return u[appId] || 0;
  return meta.apps.reduce((t, a) => t + (u[a.id] || 0), 0);
}

/* ============================================================
   画面切り替え(#memo #log #timer #plan #prefs)
   ============================================================ */
const VIEWS = ["memo", "board", "log", "timer", "plan", "prefs"];
let view = "memo";
function show(v, push = true) {
  if (!VIEWS.includes(v)) v = "memo";
  view = v;
  for (const x of VIEWS) $("#v-" + x).classList.toggle("on", x === v);
  for (const b of $("#nav").children) b.classList.toggle("on", b.dataset.v === (v === "board" ? "memo" : v));
  if (push && location.hash !== "#" + v) { try { history.replaceState(null, "", "#" + v); } catch { location.hash = v; } }
  if (v === "board") {
    renderBoard();
    if (!LS.get("boardView")) fitView();
    else { // いまのメモのカードが画面の外なら、そこへ寄せる
      const el = cardsEl.querySelector(`[data-card="${curFile}"]`);
      if (el) { const r = boardEl.getBoundingClientRect(), b = el.getBoundingClientRect();
        if (b.right < r.left + 20 || b.left > r.right - 20 || b.bottom < r.top + 20 || b.top > r.bottom - 20) centerOn(curFile); }
    }
  }
  if (v === "log") renderLog();
  if (v === "timer") renderTimer();
  if (v === "plan") renderPlan();
  if (v === "prefs") renderPrefs();
}
$("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) show(b.dataset.v); });
addEventListener("hashchange", () => show(location.hash.slice(1), false));

/* ============================================================
   シート(ダイアログ)
   ============================================================ */
function openSheet(html, mount) {
  const old = $("#sheet"), sh = old.cloneNode(false); // 開くたびに作り直し、前のシートのボタン処理を残さない
  old.replaceWith(sh);
  sh.innerHTML = `<div class="grab"></div>${html}`;
  $("#veil").classList.add("on");
  mount && mount($("#sheet"));
}
function closeSheet() { $("#veil").classList.remove("on"); $("#sheet").innerHTML = ""; }
// 背景で押し始めたタップでだけ閉じる(長押しでシートが開いた直後、指を離したタップで閉じないように)
let veilDown = false;
$("#veil").addEventListener("pointerdown", e => { veilDown = e.target.id === "veil"; });
$("#veil").addEventListener("click", e => { if (e.target.id === "veil" && veilDown) closeSheet(); veilDown = false; });
function confirmSheet(title, body, okLabel, onOk) {
  openSheet(`<h2>${esc(title)}</h2><p class="muted">${esc(body)}</p>
    <div class="btns"><button class="btn" data-x>やめる</button><button class="btn primary" style="background:var(--danger)" data-ok>${esc(okLabel)}</button></div>`,
    s => { $("[data-x]", s).onclick = closeSheet; $("[data-ok]", s).onclick = () => { closeSheet(); onOk(); }; });
}

/* ============================================================
   メモ:記入欄そのものが入れ子のアウトライン
   1行=1項目。字下げで親子をつくり、行頭の ▾/▸ で畳む
   ============================================================ */
let outline = null;       // { nodes: [{ id, t, c: [], x?: 畳み, l?: [関連先id] }] }
let zoomId = null;        // 「この項目だけ表示」中の項目
let focusId = null;       // いま書いている項目
let index = {};           // id -> { n, parent, list }
const N = (t = "") => ({ id: uid(), t, c: [] });
const FIELD_SIZING = typeof CSS !== "undefined" && CSS.supports && CSS.supports("field-sizing", "content");

function reindex() {
  index = {};
  const walk = (list, parent) => list.forEach(n => { n.c ||= []; index[n.id] = { n, parent, list }; walk(n.c, n); });
  walk(outline.nodes, null);
}
// ---- メモ(複数)。ボードの上に、すべてのメモがカードとして並ぶ ----
let files = {};       // id -> { id, name, group, order, nodes, created, updated }
let curFile = null;
function newFileObj(name, group) {
  const t = Date.now();
  return { id: uid(), name: name || "", group: group || null, order: t, nodes: [N()], created: t, updated: t };
}
function loadFiles(docs) {
  files = {};
  for (const [id, v] of Object.entries(docs)) if (id.startsWith("file-") && v && v.id) files[v.id] = v;
  if (!Object.keys(files).length) { // 以前の版のメモを、メモ1件として移す
    let nodes = docs.outline?.nodes, ts = docs.outline?._ts;
    if (!nodes) {
      nodes = migrateMemos();
      const map = {}; const w = l => l.forEach(n => { map[n.id] = n; w(n.c); }); w(nodes);
      for (const [x, y] of meta.links || []) if (map[x] && map[y]) (map[x].l ||= []).push(y);
      ts = undefined;
    }
    const hasText = l => l.some(n => n.t || (n.c && hasText(n.c)));
    if (nodes && hasText(nodes)) {
      const t = Date.now();
      files.main = { id: "main", name: "メモ", group: null, order: 0, nodes: JSON.parse(JSON.stringify(nodes)), created: t, updated: t };
      Store.putRaw("file-main", files.main, ts);
    }
  }
  if (!Object.keys(files).length) { const f = newFileObj("", null); f.auto = true; files[f.id] = f; } // 書くまで保存しない
  for (const f of Object.values(files)) { f.nodes ||= []; if (!f.nodes.length) f.nodes.push(N()); f.name ||= ""; }
  const v = LS.get("view") || {};
  setOutline(v.cur && files[v.cur] ? v.cur : allFilesSorted()[0].id);
}
function setOutline(id) {
  curFile = id; outline = files[id]; editId = null; pendingCaret = null;
  reindex();
  const st = (LS.get("view") || {}).files?.[id] || {};
  zoomId = st.zoom && index[st.zoom] ? st.zoom : null;
  focusId = st.focus && index[st.focus] ? st.focus : null;
}
function saveView() { // 開いているメモと、メモごとの絞り込み・最後の行は端末ごとに覚える
  const v = LS.get("view") || {}; v.cur = curFile; v.files ||= {};
  v.files[curFile] = { zoom: zoomId, focus: focusId };
  LS.set("view", v);
}
const groupOf = f => null; // ファイル(まとまり)はボードに置き換えた
const sortedGroups = () => meta.groups.slice().sort((a, b) => a.order - b.order);
const sortedFiles = gid => Object.values(files).filter(f => groupOf(f) === gid).sort((a, b) => a.order - b.order || a.created - b.created);
const allFilesSorted = () => Object.values(files).sort((a, b) => b.updated - a.updated); // 新しく書いたメモから
const saveFile = f => { f.updated = Date.now(); delete f.auto; Store.put("file-" + f.id, f); };

  for (let hh = 0; hh < 24; hh++) {

    if (hh % 3 === 0) g += `<text class="axis" x="${HC.left + HC.gw * hh + HC.gw / 2}" y="${HC.H - 5}" text-anchor="middle">${hh}</text>`;

    <div class="chart" id="hchart"><svg viewBox="0 0 ${HC.W} ${HC.H}" role="img" aria-label="1時間ごとの、アプリを開いていた時間">${g}</svg><div class="tip" id="htip"></div></div>
    ${segs.length ? `<button class="mini" data-hlist style="margin-top:8px">${showHourList ? "区間の一覧を隠す" : "区間を一覧で見る"}</button>` : ""}

const Timer = {

  record(s, e) {

    saveLog(key);

  start() {

      else { s.phase = "focus"; s.segStart = end; s.cycle = (s.cycle || 1) + 1; }
      s.phaseStart = end; changed = true;

  }
};

let actx = null;
function unlockAudio() { try { actx ||= new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch {} }

  try {
    if (actx) { [0, 0.25].forEach((d, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = i ? 1320 : 880; g.gain.setValueAtTime(0.0001, actx.currentTime + d); g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d + 0.4); o.connect(g).connect(actx.destination); o.start(actx.currentTime + d); o.stop(actx.currentTime + d + 0.45); }); }
  } catch {}

}
function banner(msg) {

  b.onclick = () => b.classList.remove("on");

function checkEventNotices() {
  const now = Date.now(); const done = LS.get("notified") || {};
  let dirty = false;
  for (const ev of meta.events) {
    if (ev.notify == null || ev.notify < 0) continue;
    const st = parseYmd(ev.date).getTime() + toMin(ev.start) * 60000;
    const at = st - ev.notify * 60000;
    const key = ev.id + "@" + st + "-" + ev.notify;
    if (now >= at && now < st + 10 * 60000 && !done[key]) {
      done[key] = now; dirty = true;
      chime(`予定:${ev.title}(${ev.start} 開始${ev.notify ? `、${ev.notify}分前` : ""})`);
      try { if ("Notification" in window && Notification.permission === "granted") new Notification(ev.title, { body: `${ev.start} 開始` }); } catch {}

const toMin = t => { const [h, m] = (t || "0:0").split(":").map(Number); return h * 60 + (m || 0); };

let planMode = "day", planAnchor = startOfDay(new Date());
function renderPlan() {
  const a = planAnchor;

  const label = planMode === "day" ? `${a.getMonth() + 1}月${a.getDate()}日(${WD[a.getDay()]})` : `${days[0].getMonth() + 1}/${days[0].getDate()} 〜 ${days[6].getMonth() + 1}/${days[6].getDate()}`;
  const today = ymd(new Date());
  let h = `<div class="seg">${[["day", "日別"], ["week", "週別"]].map(([k, l]) => `<button data-pm="${k}" class="${planMode === k ? "on" : ""}">${l}</button>`).join("")}</div>

  let any = false;
  for (const d of days) {
    const k = ymd(d);
    const evs = meta.events.filter(e => e.date === k).sort((x, y) => toMin(x.start) - toMin(y.start));
    h += `<div class="daygroup ${k === today ? "today" : ""}">${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})${k === today ? " 今日" : ""}</div>`;

    any = true;
    h += evs.map(e => `<button class="ev" data-ev="${e.id}"><span class="t">${esc(e.start)}〜${esc(e.end || "")}</span><span class="grow"><span class="ti">${esc(e.title)}</span>
      ${e.note ? `<div class="muted small">${esc(e.note)}</div>` : ""}<div class="muted small">${e.notify >= 0 && e.notify != null ? `🔔 ${e.notify ? e.notify + "分前" : "開始時"}に通知` : "通知なし"}</div></span></button>`).join("");
  }

}

  if (b.id === "addApp" || b.dataset.quickapp) {
    const name = (b.dataset.quickapp || $("#appName").value).trim(); if (!name) return;
    if (meta.apps.some(a => a.name === name)) { toast("すでに指定済みです"); return; }
    meta.apps.push({ id: uid(), name }); saveMeta(); renderPrefs();
  } else if (b.dataset.delapp) {
    const a = meta.apps.find(x => x.id === b.dataset.delapp);
    confirmSheet("妨害アプリから外しますか", `「${a.name}」を外します。入力済みの時間は集計に出なくなります。`, "外す", () => { meta.apps = meta.apps.filter(x => x.id !== a.id); saveMeta(); renderPrefs(); });
  } else if (b.id === "tplReset") { // 追加したものは残し、初期の3つだけを初期の中身で戻す
    meta.prefs.templates = { ...DEFAULT_TPL, ...Object.fromEntries(Object.entries(meta.prefs.templates).filter(([k]) => !(k in DEFAULT_TPL))) };
    saveMeta(); renderPrefs(); toast("初期の3つを戻しました");
  } else if (b.id === "tplAdd") {
    const T = meta.prefs.templates; let name = "新しいテンプレート", i = 2;
    while (name in T) name = `新しいテンプレート${i++}`;
    T[name] = "【見出し】\n  項目:\n  項目:";
    saveMeta(); renderPrefs();
    const inp = [...document.querySelectorAll("[data-tplname]")].find(x => x.dataset.tplname === name);
    if (inp) { inp.scrollIntoView({ block: "center" }); inp.focus(); inp.select(); }
  } else if (b.dataset.tpldel) {
    const k = b.dataset.tpldel;
    confirmSheet("テンプレートを削除しますか", `「${k}」を削除します。メモに入れ済みの行はそのまま残ります。`, "削除する", () => { delete meta.prefs.templates[k]; saveMeta(); renderPrefs(); toast("削除しました"); });
  }
  else if (b.id === "reGuide") guide();
});
$("#prefsScroll").addEventListener("change", e => {
  const P = meta.prefs, t = e.target;
  if (t.id === "pF") P.focus = Math.max(1, Math.min(180, Math.round(+t.value) || 25));
  else if (t.id === "pB") P.brk = Math.max(1, Math.min(60, Math.round(+t.value) || 5));
  else if (t.id === "pG") P.goal = Math.max(0, Math.min(1440, Math.round(+t.value) || 0));
  else if (t.dataset.tplk) P.templates[t.dataset.tplk] = t.value;
  else if (t.dataset.tplname != null) { // 名前の変更(並び順は保つ)
    const old = t.dataset.tplname, nw = t.value.trim();
    if (nw === old) return;
    if (!nw) { toast("名前を入れてください"); t.value = old; return; }
    if (nw in P.templates) { toast("同じ名前のテンプレートがあります"); t.value = old; return; }
    P.templates = Object.fromEntries(Object.entries(P.templates).map(([k, v]) => [k === old ? nw : k, v]));
    saveMeta(); renderPrefs(); toast("名前を変えました"); return;
  }
  else return;
  saveMeta(); toast("保存しました");
});
$("#prefsScroll").addEventListener("keydown", e => { if (e.target.id === "appName" && e.key === "Enter") $("#addApp").click(); });

function guide() {
  openSheet(`<h2>はじめに</h2>
    <p class="small" style="line-height:1.8">このページを<b>開いているあいだ</b>が、作業時間として自動で記録されます。ほかのアプリへ切り替えたり、画面が消えたりすると止まります。無操作で止まることはありません。</p>
    <p class="small" style="line-height:1.8">メモは上の「＋ 新しいメモ」でいくつでも作れます。「◧ ボード」を開くと、すべてのメモがカードで並び、自由に動かして<b>矢印でつなげられます</b>。</p>
    <p class="small" style="line-height:1.8">これはスマホのブラウザで試せる<b>Web試作</b>です。ネイティブ版との違いは次のとおりです。</p>
    <ul class="small" style="line-height:1.8;padding-left:1.2em;margin:0">
      <li>妨害アプリの使用時間は自動取得できないため、「記録」で分数を入力します</li>
      <li>予定の通知は、ページを開いている間だけ鳴ります</li>
      <li>インストール済みアプリの一覧は読めないため、名前で指定します</li>
    </ul>
    <p class="small" style="line-height:1.8">ネイティブ版で必要になる「使用状況へのアクセス」の許可手順は、「設定」に載せてあります。</p>
    <div class="btns"><button class="btn primary" data-ok>書きはじめる</button></div>`, s => {
    $("[data-ok]", s).onclick = () => { meta.guideSeen = true; saveMeta(); closeSheet(); show("memo"); focusStart(); };
  });
}

/* ============================================================
   起動と時計
   ============================================================ */
function refreshLive() {
  const a = startOfDay(new Date()).getTime();
  $("#liveToday").textContent = fmtSec(workMs(a, a + 864e5));
  if (view === "log" && logLive) { // 記録画面に今日が入っていれば、作業時間を秒で進める
    const tw = $("#tileWork"); if (tw) tw.textContent = fmtSec(workMs(logLive.a, logLive.b));
    const rw = $("#rowWork"); if (rw) rw.textContent = fmtSec(workMs(logLive.a, logLive.b));
    const ls = $("#liveSess"); if (ls && Work.live) ls.textContent = fmtSec(Date.now() - Math.max(Work.live.s, logLive.a));
    if (hourData && logMode === "day") { // いまの時台の棒を伸ばす
      const hh = new Date().getHours(), ha = hourData.a + hh * 36e5;
      if (Date.now() >= hourData.a && Date.now() < hourData.a + 864e5) { const bar = $("#hb" + hh); if (bar) bar.setAttribute("d", hcBar(hh, workMs(ha, ha + 36e5))); }
    }
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { Work.start(); Timer.tick(); checkEventNotices(); refreshLive(); if (view === "log") renderLog(); }
  else { flushMemoEdit(); Work.stop(); Store.flushAll(); }
});
addEventListener("pagehide", () => { flushMemoEdit(); Work.stop(); Store.flushAll(); });

// 画面下の切り替えを隠すのは、キーボードが出ている間だけ
(() => {
  let maxH = 0;
  const check = () => {
    const h = window.visualViewport ? visualViewport.height : innerHeight;
    if (h > maxH) maxH = h;
    document.body.classList.toggle("kb", h < maxH - 150);
  };
  (window.visualViewport || window).addEventListener("resize", check);
  addEventListener("orientationchange", () => { maxH = 0; setTimeout(check, 300); });
  check();
})();
function focusStart() { // 起動直後にすぐ書けるよう、前回の行(なければ最後の行)へ
  const vis = flatVisible(); const id = focusId && vis.includes(focusId) ? focusId : vis[vis.length - 1];
  if (id) { focusAt(id, index[id].n.t.length); renderOutline(); }
}
function boot() {
  if (!Object.keys(Store.localDocs()).length) LS.set("fresh", true); // 何も入っていない端末
  loadAll(); Timer.load(); Work.recover();
  Work.start();
  renderMemo();
  show(location.hash.slice(1) || "memo", false);
  refreshLive();
  if (!meta.guideSeen) guide(); else if (view === "memo") focusStart();
  setInterval(() => Work.beat(), 10000);
  setInterval(refreshLive, 1000);
  setInterval(() => { Timer.tick(); updateClock(); }, 1000);
  setInterval(checkEventNotices, 15000);
  setTimeout(checkEventNotices, 1500);
  Store.connect(() => {
    // 他端末の内容が新しかったときは読み直す(編集中の本文は保つ)
    const f = focusId, z = zoomId, cf = curFile;
    loadAll();
    if (files[cf] && cf !== curFile) setOutline(cf);
    if (f && index[f]) focusId = f; zoomId = z && index[z] ? z : null;
    if (!document.activeElement?.closest?.(".ol-t")) renderMemo(); if (view !== "memo") show(view, false); refreshLive();
    if (view === "board") renderBoard();
  });
}
boot();
</script>
</body>
