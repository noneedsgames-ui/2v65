<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1a1a19">
<title>作業記録メモ帳(試作)</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f3ef; --surface-1:#fcfcfb; --surface-2:#ecebe6; --line:#d9d7cf;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7a7873;
  --accent:#2a78d6; --accent-ink:#fff; --danger:#c4302f;
  --series-work:#2a78d6; --series-dist:#eb6834;
  --tab-sel:#0b0b0b; --tab-sel-ink:#fcfcfb;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#121211; --surface-1:#1a1a19; --surface-2:#252523; --line:#3a3936;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8f8d86;
    --accent:#3987e5; --danger:#e66767;
    --series-work:#3987e5; --series-dist:#d95926;
    --tab-sel:#f0efec; --tab-sel-ink:#121211;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text-primary);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:16px}
body{display:flex;flex-direction:column;height:100dvh;padding-top:var(--safe-t);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;min-height:0;overflow:auto;padding:12px 14px 24px}

/* nav */
nav.bottom{display:flex;border-top:1px solid var(--line);background:var(--surface-1);padding-bottom:var(--safe-b)}
nav.bottom button{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--text-muted)}
nav.bottom button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button.on{color:var(--text-primary);font-weight:600}
.livebar{font-size:11px;color:var(--text-muted);text-align:center;padding:3px 0;background:var(--surface-2);border-bottom:1px solid var(--line)}
.livebar b{color:var(--text-primary);font-variant-numeric:tabular-nums}

/* memo */
.tabs{background:var(--surface-1);border-bottom:1px solid var(--line)}
.tabs{max-height:36dvh;overflow:auto;padding:4px 0 6px}
.tabs.closed{display:none}
.node{display:flex;align-items:center;min-height:38px;padding-right:8px}
.node.sel{background:var(--surface-2)}
.node .tw{flex:none;width:30px;height:34px;font-size:14px;color:var(--text-secondary)}
.node .tw.leaf{color:var(--text-muted);font-size:10px}
.node .nm{flex:1;min-width:0;text-align:left;padding:7px 4px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.sel .nm{font-weight:700}
.node .cnt{font-size:11px;color:var(--text-muted);margin-right:6px}
.node .addc{flex:none;font-size:12px;padding:5px 9px;border-radius:999px;border:1px dashed var(--text-muted);color:var(--text-secondary)}
.addroot{display:block;margin:4px 0 0 12px;font-size:13px;color:var(--text-secondary);padding:6px 4px}
.toolbar{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--surface-1);align-items:center}
.tb{white-space:nowrap;flex:none;padding:7px 9px;border-radius:8px;font-size:13px;color:var(--text-secondary);display:flex;gap:4px;align-items:center}
.tb:active{background:var(--surface-2)}
.tb.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.spacer{flex:1}
.saved{white-space:nowrap;font-size:11px;color:var(--text-muted);padding:0 6px}
.memohead{padding:8px 14px 0;background:var(--surface-1)}
.memotitle{width:100%;border:0;background:none;font-size:20px;font-weight:700;padding:4px 0;outline:none}
.crumb{font-size:11px;color:var(--text-muted);min-height:14px}
.metas{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px}
.mini{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--text-secondary)}
.mini.tag::before{content:"#"}
.mini.link::before{content:"↔ "}
.memobody{flex:1;min-height:0;width:100%;border:0;resize:none;outline:none;background:var(--surface-1);
  padding:10px 14px 40px;line-height:1.75;font-size:16px}

/* generic */
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--text-secondary);font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{padding:6px 14px;border-radius:8px;font-size:14px;color:var(--text-secondary)}
.seg button.on{background:var(--surface-1);color:var(--text-primary);font-weight:600;box-shadow:0 1px 2px #0002}
.periodnav{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.periodnav .lbl{font-weight:600}
.periodnav button{padding:6px 12px;font-size:18px;color:var(--text-secondary)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile .k{font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:5px}
.tile .v{font-size:16px;white-space:nowrap;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .s{font-size:11px;color:var(--text-muted);margin-top:2px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.muted{color:var(--text-muted);font-size:13px}
.small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.field{display:block;margin:10px 0}
.field>span{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-1);outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{line-height:1.6;resize:vertical}
.btn{padding:10px 16px;border-radius:10px;background:var(--surface-2);font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btns{display:flex;gap:8px;margin-top:14px}
.btns .btn{flex:1}
.empty{color:var(--text-muted);font-size:14px;text-align:center;padding:24px 0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-secondary);margin:2px 0 8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--text-muted);font-size:10px}
.tip{position:absolute;pointer-events:none;background:var(--text-primary);color:var(--surface-1);font-size:12px;
  padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);display:none;line-height:1.5}
.note{font-size:12px;color:var(--text-secondary);background:var(--surface-2);border-radius:10px;padding:9px 11px;line-height:1.6}

/* timer */
.clock{font-size:64px;font-weight:300;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:18px 0 4px}
.phase{text-align:center;font-size:14px;color:var(--text-secondary);min-height:20px}
.ring{display:block;margin:6px auto 0}
.bigbtn{display:block;margin:18px auto 6px;width:150px;padding:14px;border-radius:999px;font-size:18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.bigbtn.stop{background:var(--danger)}

/* plan */
.daygroup{font-size:13px;font-weight:700;color:var(--text-secondary);margin:14px 0 4px}
.daygroup.today{color:var(--accent)}
.ev{display:flex;gap:10px;padding:10px 12px;background:var(--surface-1);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;text-align:left;width:100%}
.ev .t{font-size:13px;color:var(--text-secondary);width:88px;flex:none;font-variant-numeric:tabular-nums}
.ev .ti{font-weight:600}
.fab{position:absolute;right:16px;bottom:16px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:28px;box-shadow:0 3px 10px #0004}

/* sheet */
.veil{position:fixed;inset:0;background:#0007;display:none;z-index:20;align-items:flex-end;justify-content:center}
.veil.on{display:flex}
.sheet{background:var(--surface-1);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:16px 16px 0 0;
  padding:14px 16px calc(18px + var(--safe-b))}
.sheet h2{font-size:17px;margin:4px 0 10px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.banner{position:fixed;left:10px;right:10px;top:calc(8px + var(--safe-t));z-index:30;background:var(--text-primary);color:var(--surface-1);
  border-radius:12px;padding:12px 14px;display:none;box-shadow:0 4px 16px #0005;font-size:14px}
.banner.on{display:block}
.toast{position:fixed;left:50%;bottom:calc(76px + var(--safe-b));transform:translateX(-50%);background:var(--text-primary);color:var(--surface-1);
  padding:8px 14px;border-radius:999px;font-size:13px;z-index:31;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.hit{background:#ffd54a55;border-radius:3px}
</style>
</head>
<body>
<div class="livebar" id="livebar">作業時間 自動記録中 <b id="liveToday">0分</b>(今日)</div>
<main>
  <!-- メモ -->
  <section class="view" id="v-memo">
    <div class="tabs" id="tabs"></div>
    <div class="toolbar">
      <button class="tb" id="btnTree" aria-label="ツリーの表示切り替え">▾ ツリー</button>
      <button class="tb primary" id="addChild">＋子タブ</button>
      <button class="tb" id="btnTpl">テンプレ</button>
      <button class="tb" id="btnSearch">検索</button>
      <span class="spacer"></span>
      <span class="saved" id="saved"></span>
      <button class="tb" id="btnManage" aria-label="タブの管理">⋯</button>
    </div>
    <div class="memohead">
      <div class="crumb" id="crumb"></div>
      <input class="memotitle" id="memoTitle" placeholder="タブ名" maxlength="60">
      <div class="metas" id="metas"></div>
    </div>
    <textarea class="memobody" id="memoBody" placeholder="ここに書く。入力は自動で保存されます。" autofocus></textarea>
  </section>

  <!-- 記録 -->
  <section class="view" id="v-log">
    <div class="scroll" id="logScroll"></div>
  </section>

  <!-- タイマー -->
  <section class="view" id="v-timer">
    <div class="scroll" id="timerScroll"></div>
  </section>

  <!-- 予定 -->
  <section class="view" id="v-plan" style="position:relative">
    <div class="scroll" id="planScroll"></div>
    <button class="fab" id="addEvent" aria-label="予定を追加">＋</button>
  </section>

  <!-- 設定 -->
  <section class="view" id="v-prefs">
    <div class="scroll" id="prefsScroll"></div>
  </section>
</main>
<nav class="bottom" id="nav">
  <button data-v="memo"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z"/><path d="M9 11h6M9 15h6M9 7h3"/></svg>メモ</button>
  <button data-v="log"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>記録</button>
  <button data-v="timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>タイマー</button>
  <button data-v="plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>予定</button>
  <button data-v="prefs"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定</button>
</nav>
<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<div class="banner" id="banner"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   ユーティリティ
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ym = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const WD = ["日", "月", "火", "水", "木", "金", "土"];
function fmtDur(ms) {
  const m = Math.floor(ms / 60000);
  if (m < 1) return ms > 0 ? "1分未満" : "0分";
  const h = Math.floor(m / 60);
  return h ? `${h}時間${pad(m % 60)}分` : `${m}分`;
}
function fmtClock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
  return h ? `${h}:${pad(m)}:${pad(ss)}` : `${pad(m)}:${pad(ss)}`;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 1800);
}

/* ============================================================
   保存層:端末内(localStorage)を即時の正とし、
   claude.ai の個人用ストア(db)へ追って同期する
   ============================================================ */
const LS = {
  get(k) { try { const v = localStorage.getItem("wm:" + k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem("wm:" + k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem("wm:" + k); } catch {} },
  keys() { try { return Object.keys(localStorage).filter(k => k.startsWith("wm:")).map(k => k.slice(3)); } catch { return []; } }
};
const Store = {
  col: null, status: "端末内のみ", pending: new Map(), inflight: new Set(),
  // 書き込み:端末内へ即時、リモートへは間をおいて一件ずつ
  put(id, data) {
    data._ts = Date.now();
    LS.set("doc:" + id, data);
    this.schedule(id);
  },
  remove(id) {
    LS.del("doc:" + id);
    this.pending.delete(id);
    if (this.col) this.col.doc(id).delete().catch(() => {});
  },
  schedule(id) {
    if (!this.col) return;
    clearTimeout(this.pending.get(id));
    this.pending.set(id, setTimeout(() => this.flush(id), 1200));
  },
  async flush(id) {
    this.pending.delete(id);
    if (!this.col) return;
    if (this.inflight.has(id)) { this.schedule(id); return; }
    const data = LS.get("doc:" + id); if (!data) return;
    this.inflight.add(id);
    try { await this.col.doc(id).set(data); }
    catch (e) {
      if (e && e.code === "unavailable") setTimeout(() => this.schedule(id), 2000 + Math.random() * 2000);
      else if (e && e.code === "quota_exceeded") toast("保存容量の上限に達しました");
      else if (e && (e.code === "invalid_argument" || e.code === "revoked")) { this.col = null; this.status = "端末内のみ(同期不可)"; }
    } finally { this.inflight.delete(id); }
  },
  flushAll() { for (const id of [...this.pending.keys()]) { clearTimeout(this.pending.get(id)); this.flush(id); } },
  localDocs() {
    const out = {};
    for (const k of LS.keys()) if (k.startsWith("doc:")) { const v = LS.get(k); if (v) out[k.slice(4)] = v; }
    return out;
  }
};
// 起動後に、リモートの内容と突き合わせる(新しい方を採る)
Store.connect = async function (onMerged) {
  const api = window.claude && typeof window.claude.use === "function" ? window.claude : null;
  if (!api) return;
  let db, user, id;
  try {
    [db, user] = await Promise.all([api.use("db"), api.use("user")]);
    if (!db || !user) return;
    id = await user.id();
    if (!id) return;
  } catch { return; }
  const col = db.collection("data/users/" + id); // 3区切り=自分専用のコレクション
  this.status = "同期を確認中…";
  let snap;
  const timer = setTimeout(() => { this.status = "同期先に届きません(端末内に保存中)"; renderPrefsIfOpen(); }, 10000);
  try { snap = await col.get(); }
  catch (e) { clearTimeout(timer); this.status = "端末内のみ(同期不可)"; renderPrefsIfOpen(); return; }
  clearTimeout(timer);
  this.col = col;
  this.status = "claude.ai に同期中";
  flushMemoEdit();
  const local = this.localDocs();
  const remoteIds = new Set();
  let changed = false;
  for (const d of snap.docs) {
    if (!d.exists) continue;
    remoteIds.add(d.id);
    const r = d.data(); const l = local[d.id];
    if (!l || (r._ts || 0) > (l._ts || 0)) { LS.set("doc:" + d.id, JSON.parse(JSON.stringify(r))); changed = true; }
    else if ((l._ts || 0) > (r._ts || 0)) this.schedule(d.id);
  }
  for (const k of Object.keys(local)) if (!remoteIds.has(k)) this.schedule(k);
  if (changed) onMerged();
  renderPrefsIfOpen();
};

/* ============================================================
   データモデル
   memo-<id> : メモ(階層タブ)/ meta : タグ以外の共通設定・予定・関連
   log-YYYY-MM : その月の作業区間・タイマー記録・妨害アプリ使用時間
   ============================================================ */
const DEFAULT_TPL = {
  "素材": "【素材名】\n種類:\n入手場所:\n用途:\n見た目のメモ:\n",
  "アイテム": "【アイテム名】\n分類:\n効果:\n入手方法:\n必要な素材:\n価格:\n説明文:\n",
  "設定": "【項目名】\n概要:\n詳細:\n関連する要素:\n未決事項:\n"
};
let memos = {}, meta = null, logs = {};
function loadAll() {
  memos = {}; logs = {};
  const docs = Store.localDocs();
  for (const [id, v] of Object.entries(docs)) {
    if (id.startsWith("memo-")) memos[v.id] = v;
    else if (id.startsWith("log-")) logs[id.slice(4)] = v;
  }
  meta = docs.meta || null;
  if (!meta) meta = { links: [], events: [], apps: [], prefs: {}, guideSeen: false, current: null };
  meta.links ||= []; meta.events ||= []; meta.apps ||= []; meta.prefs ||= {};
  const p = meta.prefs;
  p.focus ??= 25; p.brk ??= 5; p.goal ??= 0; p.templates ||= { ...DEFAULT_TPL };
}
const saveMeta = () => Store.put("meta", meta);
const saveMemo = m => { m.updated = Date.now(); Store.put("memo-" + m.id, m); };
function logOf(key) { return logs[key] ||= { sessions: [], timers: [], usage: {} }; }
const saveLog = key => Store.put("log-" + key, logs[key]);

/* ============================================================
   作業時間の自動記録:画面が前面にある間だけ数える
   ============================================================ */
const Work = {
  live: null,
  start() {
    if (this.live || document.visibilityState !== "visible") return;
    const now = Date.now();
    this.live = { s: now, beat: now };
    LS.set("live", this.live);
  },

/* ============================================================
   記録(作業時間 × 妨害アプリ)
   ============================================================ */
let logMode = "day", logAnchor = startOfDay(new Date());

  const a = logAnchor;

  if (logMode === "week") {
    const s = addDays(a, -((a.getDay() + 6) % 7)); const days = [...Array(7)].map((_, i) => addDays(s, i));
    return { days, label: `${s.getMonth() + 1}/${s.getDate()} 〜 ${days[6].getMonth() + 1}/${days[6].getDate()}` };
  }
  const s = new Date(a.getFullYear(), a.getMonth(), 1); const n = new Date(a.getFullYear(), a.getMonth() + 1, 0).getDate();
  return { days: [...Array(n)].map((_, i) => addDays(s, i)), label: `${a.getFullYear()}年${a.getMonth() + 1}月` };
}

  renderLog();
}

    return { d, k, work: workMs(a, b), dist: distMs(k), timer: timerMs(a, b) }; });
  const sum = f => rows.reduce((t, r) => t + r[f], 0);
  const W = sum("work"), D = sum("dist"), T = sum("timer");
  const goal = meta.prefs.goal * 60000 * days.length;
  const isToday = logMode === "day" && ymd(days[0]) === ymd(new Date());
  let html = `<div class="seg" id="logSeg">${[["day", "日別"], ["week", "週別"], ["month", "月別"]].map(([k, l]) => `<button data-m="${k}" class="${logMode === k ? "on" : ""}">${l}</button>`).join("")}</div>
    <div class="periodnav"><button data-sh="-1" aria-label="前へ">‹</button><span class="lbl">${label}</span><button data-sh="1" aria-label="次へ">›</button></div>
    <div class="tiles">
      <div class="tile"><div class="k"><i class="sw" style="background:var(--series-work)"></i>作業(自動)</div><div class="v">${fmtDur(W)}</div><div class="s">${goal ? `目標比 ${Math.round(W / goal * 100)}%` : isToday ? "計測中" : "&nbsp;"}</div></div>
      <div class="tile"><div class="k"><i class="sw" style="background:var(--series-dist)"></i>妨害アプリ</div><div class="v">${fmtDur(D)}</div><div class="s">${W >= 300000 && D ? `作業の ${(D / W).toFixed(1)} 倍` : "&nbsp;"}</div></div>
      <div class="tile"><div class="k">タイマー</div><div class="v">${fmtDur(T)}</div><div class="s">別集計</div></div>
    </div>`;
  if (logMode === "day") html += dayDetail(rows[0]);

}
$("#logScroll").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;

  else if (b.dataset.sh) shiftPeriod(+b.dataset.sh);
  else if (b.dataset.gotoday) { logMode = "day"; logAnchor = parseYmd(b.dataset.gotoday); renderLog(); }

  else if (b.dataset.goapps != null) show("prefs");
});

  const i = e.target.closest("[data-usage]"); if (!i) return;
  const [k, app] = i.dataset.usage.split("|");
  const L = logOf(k.slice(0, 7)); L.usage[k] ||= {};
  const min = Math.max(0, Math.min(1440, Math.round(+i.value || 0)));
  L.usage[k][app] = min * 60000; saveLog(k.slice(0, 7)); renderLog();

let showTable = false;
function dayDetail(r) {
  const max = Math.max(r.work, ...meta.apps.map(a => distMs(r.k, a.id)), 60000);

  let h = `<div class="card"><h3>作業時間と妨害アプリ</h3>

      <div style="display:flex;gap:8px">
        <label class="field" style="flex:1"><span>集中(分)</span><input class="inp" type="number" inputmode="numeric" min="1" max="180" id="pF" value="${P.focus}"></label>
        <label class="field" style="flex:1"><span>休憩(分)</span><input class="inp" type="number" inputmode="numeric" min="1" max="60" id="pB" value="${P.brk}"></label>
        <label class="field" style="flex:1"><span>1日の目標(分)</span><input class="inp" type="number" inputmode="numeric" min="0" max="1440" id="pG" value="${P.goal || ""}" placeholder="なし"></label>
      </div>
    </div>
    <div class="card"><h3>テンプレート</h3>
      ${Object.keys(P.templates).map(k => `<label class="field"><span>${esc(k)}</span><textarea class="inp" rows="5" data-tplk="${esc(k)}">${esc(P.templates[k])}</textarea></label>`).join("")}
      <button class="mini" id="tplReset">初期の内容に戻す</button>
    </div>
    <div class="card"><h3>保存</h3>
      <div class="small">状態:<b>${esc(Store.status)}</b></div>
      <p class="muted small" style="line-height:1.6">入力はまずこの端末に保存し、claude.ai にサインインして開いている場合は、あなた専用の領域へ追って同期します。ほかの人からは見えません。</p>
      <button class="mini" id="reGuide">はじめにの案内をもう一度見る</button>
    </div>
    <p class="muted small" style="text-align:center">作業記録メモ帳 Web試作 · 要件定義書(2026-11-01)準拠</p>`;
}
$("#prefsScroll").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "addApp" || b.dataset.quickapp) {
    const name = (b.dataset.quickapp || $("#appName").value).trim(); if (!name) return;
    if (meta.apps.some(a => a.name === name)) { toast("すでに指定済みです"); return; }
    meta.apps.push({ id: uid(), name }); saveMeta(); renderPrefs();
  } else if (b.dataset.delapp) {
    const a = meta.apps.find(x => x.id === b.dataset.delapp);
    confirmSheet("妨害アプリから外しますか", `「${a.name}」を外します。入力済みの時間は集計に出なくなります。`, "外す", () => { meta.apps = meta.apps.filter(x => x.id !== a.id); saveMeta(); renderPrefs(); });
  } else if (b.id === "tplReset") { meta.prefs.templates = { ...DEFAULT_TPL }; saveMeta(); renderPrefs(); toast("戻しました"); }
  else if (b.id === "reGuide") guide();
});
$("#prefsScroll").addEventListener("change", e => {
  const P = meta.prefs, t = e.target;
  if (t.id === "pF") P.focus = Math.max(1, Math.min(180, Math.round(+t.value) || 25));
  else if (t.id === "pB") P.brk = Math.max(1, Math.min(60, Math.round(+t.value) || 5));
  else if (t.id === "pG") P.goal = Math.max(0, Math.min(1440, Math.round(+t.value) || 0));
  else if (t.dataset.tplk) P.templates[t.dataset.tplk] = t.value;
  else return;
  saveMeta(); toast("保存しました");
});
$("#prefsScroll").addEventListener("keydown", e => { if (e.target.id === "appName" && e.key === "Enter") $("#addApp").click(); });

function guide() {
  openSheet(`<h2>はじめに</h2>
    <p class="small" style="line-height:1.8">このページを<b>開いているあいだ</b>が、作業時間として自動で記録されます。ほかのアプリへ切り替えたり、画面が消えたりすると止まります。無操作で止まることはありません。</p>
    <p class="small" style="line-height:1.8">これはスマホのブラウザで試せる<b>Web試作</b>です。ネイティブ版との違いは次のとおりです。</p>
    <ul class="small" style="line-height:1.8;padding-left:1.2em;margin:0">
      <li>妨害アプリの使用時間は自動取得できないため、「記録」で分数を入力します</li>
      <li>予定の通知は、ページを開いている間だけ鳴ります</li>
      <li>インストール済みアプリの一覧は読めないため、名前で指定します</li>
    </ul>
    <p class="small" style="line-height:1.8">ネイティブ版で必要になる「使用状況へのアクセス」の許可手順は、「設定」に載せてあります。</p>
    <div class="btns"><button class="btn primary" data-ok>書きはじめる</button></div>`, s => {
    $("[data-ok]", s).onclick = () => { meta.guideSeen = true; saveMeta(); closeSheet(); show("memo"); $("#memoBody").focus(); };
  });
}

/* ============================================================
   起動と時計
   ============================================================ */
function refreshLive() {
  const a = startOfDay(new Date()).getTime();
  $("#liveToday").textContent = fmtDur(workMs(a, a + 864e5));
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { Work.start(); Timer.tick(); checkEventNotices(); refreshLive(); if (view === "log") renderLog(); }
  else { flushMemoEdit(); Work.stop(); Store.flushAll(); }
});
addEventListener("pagehide", () => { flushMemoEdit(); Work.stop(); Store.flushAll(); });

function boot() {
  loadAll(); Timer.load(); Work.recover(); ensureMemo();
  Work.start();
  renderMemo();
  show(location.hash.slice(1) || "memo", false);
  refreshLive();
  if (!meta.guideSeen) guide(); else if (view === "memo") $("#memoBody").focus();
  setInterval(() => { Work.beat(); refreshLive(); }, 10000);
  setInterval(() => { Timer.tick(); updateClock(); }, 1000);
  setInterval(checkEventNotices, 15000);
  setTimeout(checkEventNotices, 1500);
  Store.connect(() => {
    // 他端末の内容が新しかったときは読み直す(編集中の本文は保つ)
    const cur = meta.current;
    loadAll(); ensureMemo();
    if (cur && memos[cur]) meta.current = cur;
    renderMemo(); if (view !== "memo") show(view, false); refreshLive();
  });
}
boot();
</script>
</body>
</html>
